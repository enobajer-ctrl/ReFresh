 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:900px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 25px rgba(59,130,246,.15);
  margin-bottom:25px;
}

.box h2{
  color:#3B82F6;
  margin-bottom:15px;
}

.member-warning{
  background:#7f1d1d;
  color:#fecaca;
  border:1px solid #991b1b;
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
  display:none;
}

.member-warning a{
  color:white;
  font-weight:bold;
}

.item-info{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:16px;
  margin-bottom:18px;
}

.message{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.message h3{
  color:#3B82F6;
  margin-bottom:6px;
}

.message p{
  color:#ccc;
  margin-bottom:6px;
}

textarea{
  width:100%;
  min-height:120px;
  padding:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:15px;
  margin-bottom:14px;
}

button{
  width:100%;
  padding:14px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#555;
  cursor:not-allowed;
}

.small{
  color:#888;
  font-size:13px;
}

@media(max-width:650px){
  .top{flex-direction:column;gap:18px}
  .nav a{display:inline-block;margin:8px}
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>Messages</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="membership.html">Membership</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="notifications.html">Notifications</a>
    </div>
  </div>

  <div id="memberWarning" class="member-warning">
    <strong>Membership Required</strong>
    <p>💎 You need an active ReFresh Membership to message sellers.</p>
    <br>
    <a href="membership.html">Become a Member</a>
  </div>

  <div class="box">
    <h2>Conversation</h2>

    <div class="item-info">
      <h3 id="itemName">Loading item...</h3>
      <p id="sellerName"></p>
    </div>

    <div id="messages">Loading messages...</div>
  </div>

  <div class="box">
    <h2>Reply</h2>

    <textarea id="messageText" placeholder="Type your message..."></textarea>
    <button id="sendBtn">Send Message</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  getDoc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const listingId = params.get("listingId");

let currentUser = null;
let currentItem = null;
let membershipActive = false;

onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  if(!user){
    alert("Please log in to use messages.");
    window.location.href = "login.html";
    return;
  }

  const userSnap = await getDoc(doc(db, "users", user.uid));
  const userData = userSnap.exists() ? userSnap.data() : {};
  membershipActive = userData.membershipStatus === "active";

  if(!membershipActive){
    document.getElementById("memberWarning").style.display = "block";
    document.getElementById("sendBtn").disabled = true;
    document.getElementById("sendBtn").innerText = "Membership Required";
  }

  await loadItem();
  await loadMessages();
});

async function loadItem(){
  if(!listingId){
    document.getElementById("itemName").innerText = "No listing selected";
    return;
  }

  const itemRef = doc(db, "listings", listingId);
  const itemSnap = await getDoc(itemRef);

  if(itemSnap.exists()){
    currentItem = itemSnap.data();

    document.getElementById("itemName").innerText =
      currentItem.itemName || "Untitled Item";
    document.getElementById("sellerName").innerText =
      "Seller: " + (currentItem.sellerName || "Seller");
  } else {
    document.getElementById("itemName").innerText = "Item not found";
  }
}

async function loadMessages(){
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  if(!listingId){
    messagesDiv.innerHTML = "<p>No conversation selected.</p>";
    return;
  }

  const q = query(
    collection(db, "messages"),
    where("listingId", "==", listingId)
  );

  const snapshot = await getDocs(q);

  if(snapshot.empty){
    messagesDiv.innerHTML = "<p>No messages yet. Start the conversation.</p>";
    return;
  }

  snapshot.forEach((messageDoc) => {
    const msg = messageDoc.data();

    messagesDiv.innerHTML += `
      <div class="message">
        <h3>${msg.senderEmail || "User"}</h3>
        <p>${msg.message || ""}</p>
        <p class="small">${msg.timestamp || ""}</p>
      </div>
    `;
  });
}

document.getElementById("sendBtn").addEventListener("click", async () => {
  if(!currentUser){
    alert("Please log in first.");
    window.location.href = "login.html";
    return;
  }

  if(!membershipActive){
    alert("ReFresh Membership is required to send messages.");
    window.location.href = "membership.html";
    return;
  }

  if(!listingId || !currentItem){
    alert("Listing not loaded.");
    return;
  }

  const messageText = document.getElementById("messageText").value.trim();

  if(messageText === ""){
    alert("Type a message first.");
    return;
  }

  try{
    await addDoc(collection(db, "messages"), {
      listingId: listingId,
      itemName: currentItem.itemName || "",
      sellerId: currentItem.sellerId || "",
      sellerName: currentItem.sellerName || "Seller",
      senderId: currentUser.uid,
      senderEmail: currentUser.email,
      message: messageText,
      timestamp: new Date().toISOString()
    });

    if(currentItem.sellerId && currentItem.sellerId !== currentUser.uid){
      await addDoc(collection(db, "notifications"), {
        userId: currentItem.sellerId,
        title: "New Message",
        message: `${currentUser.email} sent a message about ${currentItem.itemName || "your item"}.`,
        listingId: listingId,
        itemName: currentItem.itemName || "",
        createdAt: new Date().toISOString(),
        read: false
      });
    }

    alert("Message sent!");
    document.getElementById("messageText").value = "";
    loadMessages();
  } catch(error){
    alert(error.message);
  }
});
</script>

</body>
</html>
