<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message Seller | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:900px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:28px;
  box-shadow:0 0 25px rgba(59,130,246,.15);
  margin-bottom:25px;
}

.box h2{
  color:#3B82F6;
  margin-bottom:15px;
}

.item-info{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:18px;
  margin-bottom:20px;
}

.item-info p{
  color:#ccc;
  margin:8px 0;
}

textarea{
  width:100%;
  padding:15px;
  min-height:130px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:16px;
  margin-bottom:15px;
}

textarea:focus{
  outline:none;
  border-color:#3B82F6;
}

button{
  width:100%;
  padding:15px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.message{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.message h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.message p{
  color:#ccc;
  margin-bottom:6px;
}

.small{
  color:#888;
  font-size:13px;
}

@media(max-width:650px){
  .top{
    flex-direction:column;
    gap:18px;
  }

  .nav a{
    display:inline-block;
    margin:8px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>Messages</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <div class="box">
    <h2>Message Seller</h2>

    <div class="item-info">
      <h3 id="itemName">Loading item...</h3>
      <p id="brand"></p>
      <p id="seller"></p>
    </div>

    <textarea id="messageText" placeholder="Ask the seller a question about this item..."></textarea>

    <button id="sendBtn">Send Message</button>
  </div>

  <div class="box">
    <h2>Messages About This Item</h2>
    <div id="messages">Loading messages...</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const listingId = params.get("listingId");

let currentItem = null;

async function loadItem(){
  if(!listingId){
    document.getElementById("itemName").innerText = "No item selected";
    return;
  }

  const itemRef = doc(db, "listings", listingId);
  const itemSnap = await getDoc(itemRef);

  if(itemSnap.exists()){
    currentItem = itemSnap.data();

    document.getElementById("itemName").innerText = currentItem.itemName || "Untitled Item";
    document.getElementById("brand").innerText = "Brand: " + (currentItem.brand || "N/A");
    document.getElementById("seller").innerText = "Seller: " + (currentItem.sellerName || "Seller");
  } else {
    document.getElementById("itemName").innerText = "Item not found";
  }
}

document.getElementById("sendBtn").addEventListener("click", async () => {
  const user = auth.currentUser;

  if(!user){
    alert("Please log in to message the seller.");
    window.location.href = "login.html";
    return;
  }

  if(!currentItem){
    alert("Item not loaded yet.");
    return;
  }

  const messageText = document.getElementById("messageText").value;

  if(messageText.trim() === ""){
    alert("Type a message first.");
    return;
  }

  try{
    await addDoc(collection(db, "messages"), {
      listingId: listingId,
      itemName: currentItem.itemName || "",
      brand: currentItem.brand || "",
      sellerName: currentItem.sellerName || "Seller",
      senderEmail: user.email,
      message: messageText,
      timestamp: new Date().toISOString()
    });

    alert("Message sent!");
    document.getElementById("messageText").value = "";
    loadMessages();
  }catch(error){
    alert(error.message);
  }
});

async function loadMessages(){
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  if(!listingId){
    messagesDiv.innerHTML = "<p>No item selected.</p>";
    return;
  }

  const messagesQuery = query(
    collection(db, "messages"),
    where("listingId", "==", listingId)
  );

  const snapshot = await getDocs(messagesQuery);

  if(snapshot.empty){
    messagesDiv.innerHTML = "<p>No messages yet for this item.</p>";
    return;
  }

  snapshot.forEach((doc) => {
    const msg = doc.data();

    messagesDiv.innerHTML += `
      <div class="message">
        <h3>${msg.senderEmail || "User"}</h3>
        <p>${msg.message || ""}</p>
        <p class="small">${msg.timestamp || ""}</p>
      </div>
    `;
  });
}

loadItem();
loadMessages();
</script>

</body>
</html>
