<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1000px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 25px rgba(59,130,246,.15);
  margin-bottom:25px;
}

.box h2{
  color:#3B82F6;
  margin-bottom:15px;
}

input,textarea{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:15px;
}

textarea{
  min-height:120px;
}

button{
  width:100%;
  padding:14px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.message h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.message p{
  color:#ccc;
  margin-bottom:6px;
}

.small{
  color:#888;
  font-size:13px;
}

@media(max-width:650px){
  .top{
    flex-direction:column;
    gap:18px;
  }

  .nav a{
    display:inline-block;
    margin:8px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>Messages</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <div class="box">
    <h2>Send Message</h2>

    <input id="senderEmail" placeholder="Your Email">
    <input id="receiverEmail" placeholder="Seller or Buyer Email">
    <textarea id="messageText" placeholder="Type your message..."></textarea>

    <button id="sendBtn">Send Message</button>
  </div>

  <div class="box">
    <h2>Message Inbox</h2>
    <div id="messages">Loading messages...</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("sendBtn").addEventListener("click", async () => {
  try{
    await addDoc(collection(db, "messages"), {
      senderEmail: document.getElementById("senderEmail").value,
      receiverEmail: document.getElementById("receiverEmail").value,
      message: document.getElementById("messageText").value,
      timestamp: new Date().toISOString()
    });

    alert("Message sent!");
    document.getElementById("messageText").value = "";
    loadMessages();
  }catch(error){
    alert(error.message);
  }
});

async function loadMessages(){
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  const snapshot = await getDocs(collection(db, "messages"));

  if(snapshot.empty){
    messagesDiv.innerHTML = "<p>No messages yet.</p>";
    return;
  }

  snapshot.forEach((doc) => {
    const msg = doc.data();

    messagesDiv.innerHTML += `
      <div class="message">
        <h3>From: ${msg.senderEmail || "Unknown"}</h3>
        <p>To: ${msg.receiverEmail || "Unknown"}</p>
        <p>${msg.message || ""}</p>
        <p class="small">${msg.timestamp || ""}</p>
      </div>
    `;
  });
}

loadMessages();
</script>

</body>
</html>
