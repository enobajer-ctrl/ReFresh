<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Activated | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:#0b0b0d;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:25px;
}

.card{
max-width:650px;
width:100%;
background:#171717;
border:1px solid #2b2b2b;
border-radius:25px;
padding:50px;
text-align:center;
box-shadow:0 0 25px rgba(59,130,246,.15);
}

h1{
color:#3B82F6;
font-size:42px;
margin-bottom:15px;
}

p{
color:#ccc;
font-size:18px;
margin-bottom:25px;
line-height:1.6;
}

.status{
color:#aaa;
font-size:14px;
margin-bottom:20px;
}

.btn{
display:inline-block;
background:#3B82F6;
color:white;
padding:15px 25px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
font-size:16px;
}
</style>
</head>

<body>

<div class="card">
<h1>🎉 Membership Activated</h1>

<p>
Welcome to ReFresh Membership.
Your account now has access to member rentals and premium marketplace features.
</p>

<p class="status" id="statusText">Saving membership...</p>

<a href="browse.html" class="btn">
Start Browsing
</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  const statusText = document.getElementById("statusText");

  if(!user){
    statusText.innerText = "Please log in so we can save your membership.";
    return;
  }

  try{
    await setDoc(doc(db, "users", user.uid), {
      email: user.email,
      membershipStatus: "active",
      membershipPlan: "ReFresh Buyer Membership",
      membershipPrice: 8.99,
      membershipStartedAt: new Date().toISOString()
    }, { merge: true });

    statusText.innerText = "Membership saved to your account ✓";
  }catch(error){
    statusText.innerText = "Membership payment worked, but saving failed. Contact support.";
  }
});
</script>

</body>
</html>
