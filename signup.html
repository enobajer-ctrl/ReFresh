<!DOCTYPE html>
<html>
<head>
<title>Sign Up - ReFresh</title>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:30px;">

<h1>Create Account</h1>

<input id="username" type="text" placeholder="Username"><br><br>

<input id="email" type="email" placeholder="Email"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button id="signupBtn">Create Account</button>

<br><br>

<a href="index.html">Back Home</a>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
  const db = getFirestore(app);

document.getElementById("signupBtn").addEventListener("click", () => {
  alert("Create button clicked");
  const username = document.getElementById("username").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
.then(async (userCredential) => {
  await setDoc(doc(db, "users", userCredential.user.uid), {
    username: username,
    email: email
  });

  alert("Account created!");
  window.location.href = "dashboard.html";
})
      .catch((error) => {
  alert(error.message);
});
});
</script>


</body>
</html>
