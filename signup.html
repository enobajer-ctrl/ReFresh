<!DOCTYPE html>
<html>
<head>
<title>Sign Up - ReFresh</title>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:30px;">

<h1>Create Account</h1>

<input id="name" type="text" placeholder="Full Name"><br><br>

<input id="email" type="email" placeholder="Email"><br><br>

<input id="password" type="password" placeholder="Password"><br><br>

<button id="signupBtn">Create Account</button>

<br><br>

<a href="index.html">Back Home</a>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9D_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("signupBtn").addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Account created!");
      window.location.href = "dashboard.html";
    })
    .catch((error) => {
      alert(error.message);
    });
});
</script>


</body>
</html>
