<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.box{background:#1a1a1a;width:100%;max-width:460px;padding:35px;border-radius:20px;border:1px solid #333;box-shadow:0 0 30px rgba(59,130,246,.25)}
.logo{text-align:center;margin-bottom:25px}
.logo img{width:120px;margin-bottom:10px}
.logo h1{color:#3B82F6;letter-spacing:3px}
h2{text-align:center;margin-bottom:10px}
p{text-align:center;color:#aaa;margin-bottom:25px}
input,textarea{width:100%;padding:15px;margin-bottom:15px;background:#111;border:1px solid #333;border-radius:12px;color:white;font-size:16px}
textarea{min-height:80px}
input:focus,textarea:focus{outline:none;border-color:#3B82F6}
button{width:100%;padding:15px;background:#3B82F6;color:white;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.links{text-align:center;margin-top:25px}
.links a{color:#3B82F6;text-decoration:none;font-weight:bold}
.small{margin-top:12px;color:#aaa}
</style>
</head>

<body>

<div class="box">
  <div class="logo">
    <img src="image-1.jpg" alt="ReFresh Logo">
    <h1>REFRESH</h1>
  </div>

  <h2>Create Account</h2>
  <p>Join the ReFresh marketplace.</p>

  <input id="username" type="text" placeholder="Username">
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <textarea id="bio" placeholder="Short bio optional"></textarea>

  <button id="signupBtn">Create Account</button>

  <div class="links">
    <p class="small">Already have an account?</p>
    <a href="login.html">Login</a>
    <br><br>
    <a href="index.html">← Back Home</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

function getInitials(username){
  if(!username) return "U";
  return username.substring(0,2).toUpperCase();
}

document.getElementById("signupBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const bio = document.getElementById("bio").value.trim();

  if(!username || !email || !password){
    alert("Username, email, and password are required.");
    return;
  }

  try{
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);

    await setDoc(doc(db, "users", userCredential.user.uid), {
      username: username,
      email: email,
      bio: bio || "ReFresh member.",
      initials: getInitials(username),
      createdAt: new Date().toISOString()
    });

    alert("Account created!");
    window.location.href = "dashboard.html";

  }catch(error){
    alert(error.message);
  }
});
</script>

</body>
</html>
