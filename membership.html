<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReFresh Membership</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:#0b0b0d;
color:white;
min-height:100vh;
padding:25px;
}

.page{
max-width:1000px;
margin:auto;
}

.hero{
text-align:center;
padding:60px 20px;
background:linear-gradient(135deg,#111827,#0b0b0d);
border:1px solid #263244;
border-radius:25px;
margin-bottom:30px;
}

.hero h1{
font-size:48px;
color:#3B82F6;
margin-bottom:15px;
}

.hero p{
color:#ccc;
font-size:18px;
}

.card{
background:#171717;
border:1px solid #2b2b2b;
border-radius:25px;
padding:35px;
max-width:600px;
margin:auto;
text-align:center;
box-shadow:0 0 20px rgba(59,130,246,.12);
}

.price{
font-size:60px;
font-weight:bold;
color:#3B82F6;
margin:20px 0;
}

.price span{
font-size:18px;
color:#aaa;
}

.feature{
padding:12px;
color:#ddd;
border-bottom:1px solid #2b2b2b;
}

button{
width:100%;
padding:18px;
margin-top:25px;
background:#3B82F6;
color:white;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}
</style>
</head>

<body>

<div class="page">

<div class="hero">
<h1>ReFresh Membership</h1>
<p>Unlock rentals across the marketplace.</p>
</div>

<div class="card">

<div class="price">
$8.99
<span>/month</span>
</div>

<div class="feature">✓ Unlimited browsing</div>
<div class="feature">✓ Rent items across ReFresh</div>
<div class="feature">✓ Faster checkout</div>
<div class="feature">✓ Access premium rentals</div>
<div class="feature">✓ Priority support</div>

<button id="subscribeBtn">
Become a Member
</button>

</div>

</div>

<script>
document.getElementById("subscribeBtn").addEventListener("click", async () => {

try{

const response = await fetch(
"https://refresh-payments.vercel.app/api/create-checkout-session",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
checkoutType:"membership"
})
}
);

const data = await response.json();

if(data.url){
window.location.href = data.url;
}else{
alert("Unable to start membership checkout.");
}

}catch(error){
alert(error.message);
}

});
</script>

</body>
</html>
