<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1000px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
  letter-spacing:3px;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.profile-card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:35px;
  text-align:center;
  box-shadow:0 0 30px rgba(59,130,246,.2);
  margin-bottom:30px;
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#3B82F6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  margin:0 auto 20px;
}

.profile-card h2{
  font-size:32px;
  margin-bottom:8px;
}

.profile-card p{
  color:#aaa;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.stat{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
  text-align:center;
}

.stat h3{
  color:#3B82F6;
  font-size:28px;
  margin-bottom:8px;
}

.section{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:30px;
}

.section h2{
  color:#3B82F6;
  margin-bottom:15px;
}

.section p{
  color:#ccc;
}

@media(max-width:650px){
  .top{
    flex-direction:column;
    gap:18px;
  }

  .nav a{
    display:inline-block;
    margin:8px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </div>

  <div class="profile-card">
    <div class="avatar">👤</div>
    <h2>My Profile</h2>
    <p>ReFresh member</p>
  </div>

  <div class="stats">
    <div class="stat">
      <h3>0</h3>
      <p>Listings</p>
    </div>

    <div class="stat">
      <h3>0</h3>
      <p>Active Rentals</p>
    </div>

    <div class="stat">
      <h3>$0</h3>
      <p>Earnings</p>
    </div>
  </div>

  <div class="section">
    <h2>About This Profile</h2>
    <p>
      This is where seller details, reviews, profile photos, and personal listings will appear as ReFresh grows.
    </p>
  </div>

</div>

</body>
</html>
