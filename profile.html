<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1050px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:65px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.box,.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  margin-bottom:22px;
  box-shadow:0 0 18px rgba(59,130,246,.12);
}

.profile{
  display:flex;
  gap:22px;
  align-items:center;
  flex-wrap:wrap;
}

.avatar{
  width:95px;
  height:95px;
  border-radius:50%;
  background:#3B82F6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:bold;
}

h2,h3{
  color:#3B82F6;
  margin-bottom:10px;
}

p{
  color:#ccc;
  margin-bottom:7px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:16px;
  margin-bottom:22px;
}

.stat{
  font-size:28px;
  font-weight:bold;
  color:white;
}

button,.btn{
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:10px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  margin-top:10px;
  margin-right:8px;
}

.secondary{
  background:#222;
  border:1px solid #3B82F6;
}

input{
  width:100%;
  padding:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  margin-bottom:12px;
}

.item{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.item h3{
  color:#3B82F6;
}

@media(max-width:650px){
  .top{flex-direction:column;gap:15px}
  .nav a{display:inline-block;margin:8px}
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="settings.html">Settings</a>
    </div>
  </div>

  <div class="box">
    <div class="profile">
      <div class="avatar" id="avatarInitials">RF</div>

      <div>
        <h2 id="profileName">@user</h2>
        <p id="bioText">Loading bio...</p>
        <p id="memberSince">ReFresh member</p>
        <p id="ratingText">Average Rating: Loading...</p>

        <a href="dashboard.html" class="btn">Go To Dashboard</a>
        <a href="settings.html" class="btn secondary">Edit Profile</a>
        <button id="messageBtn" class="secondary">Message Seller</button>
      </div>
    </div>
  </div>

  <div class="box">
    <h2>View Another Seller</h2>
    <input id="sellerSearch" placeholder="Enter seller username">
    <button id="searchBtn">View Seller</button>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Listings</h3>
      <p class="stat" id="listingCount">0</p>
    </div>

    <div class="card">
      <h3>Reviews</h3>
      <p class="stat" id="reviewCount">0</p>
    </div>

    <div class="card">
      <h3>Requests</h3>
      <p class="stat" id="requestCount">0</p>
    </div>

    <div class="card">
      <h3>Favorites</h3>
      <p class="stat" id="favoriteCount">0</p>
    </div>
  </div>

  <div class="box">
    <h2>Listings</h2>
    <div id="sellerListings">Loading listings...</div>
  </div>

  <div class="box">
    <h2>Reviews</h2>
    <div id="reviews">Loading reviews...</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const sellerFromUrl = params.get("seller");

let currentSellerName = "";

onAuthStateChanged(auth, async (user) => {
  if(sellerFromUrl){
    loadSellerByName(sellerFromUrl);
    return;
  }

  if(user){
    const userSnap = await getDoc(doc(db, "users", user.uid));
    const userData = userSnap.exists() ? userSnap.data() : {};

    const username = userData.username || "user";
    currentSellerName = username;

    document.getElementById("profileName").innerText = "@" + username;
    document.getElementById("bioText").innerText = userData.bio || "ReFresh member.";
    document.getElementById("avatarInitials").innerText = userData.initials || username.substring(0,2).toUpperCase();
    document.getElementById("memberSince").innerText = "ReFresh member";

    loadSellerByUserId(user.uid, username);
  } else {
    document.getElementById("profileName").innerText = "@guest";
    document.getElementById("bioText").innerText = "Log in to view your profile.";
    document.getElementById("sellerListings").innerHTML = "<p>Please log in or search a seller.</p>";
    document.getElementById("reviews").innerHTML = "<p>Please log in or search a seller.</p>";
  }
});

document.getElementById("searchBtn").addEventListener("click", () => {
  const name = document.getElementById("sellerSearch").value.trim();

  if(!name){
    alert("Enter a seller username.");
    return;
  }

  loadSellerByName(name);
});

document.getElementById("messageBtn").addEventListener("click", () => {
  if(!currentSellerName){
    alert("No seller selected.");
    return;
  }

  window.location.href = "messaging.html?seller=" + encodeURIComponent(currentSellerName);
});

async function loadSellerByUserId(userId, username){
  const listingsSnap = await getDocs(collection(db, "listings"));
  let listings = [];

  listingsSnap.forEach((listingDoc) => {
    const item = listingDoc.data();

    if(item.sellerId === userId){
      listings.push({id: listingDoc.id, ...item});
    }
  });

  loadProfileData(username, listings);
}

async function loadSellerByName(sellerName){
  currentSellerName = sellerName;

  document.getElementById("profileName").innerText = "@" + sellerName;
  document.getElementById("bioText").innerText = "ReFresh seller.";
  document.getElementById("avatarInitials").innerText = sellerName.substring(0,2).toUpperCase();
  document.getElementById("memberSince").innerText = "Seller Profile";

  const listingsSnap = await getDocs(collection(db, "listings"));
  let listings = [];

  listingsSnap.forEach((listingDoc) => {
    const item = listingDoc.data();

    if((item.sellerName || "").toLowerCase() === sellerName.toLowerCase()){
      listings.push({id: listingDoc.id, ...item});
    }
  });

  loadProfileData(sellerName, listings);
}

async function loadProfileData(sellerName, listings){
  const reviewsSnap = await getDocs(collection(db, "reviews"));
  const requestsSnap = await getDocs(collection(db, "rentalRequests"));
  const favoritesSnap = await getDocs(collection(db, "favorites"));

  let reviews = [];
  let requestCount = 0;
  let favoriteCount = 0;

  reviewsSnap.forEach((reviewDoc) => {
    const r = reviewDoc.data();

    if((r.sellerName || "").toLowerCase() === sellerName.toLowerCase()){
      reviews.push(r);
    }
  });

  requestsSnap.forEach((requestDoc) => {
    const req = requestDoc.data();

    if((req.sellerName || "").toLowerCase() === sellerName.toLowerCase()){
      requestCount++;
    }
  });

  favoritesSnap.forEach((favDoc) => {
    const fav = favDoc.data();

    listings.forEach((item) => {
      if(fav.listingId === item.id){
        favoriteCount++;
      }
    });
  });

  document.getElementById("listingCount").innerText = listings.length;
  document.getElementById("reviewCount").innerText = reviews.length;
  document.getElementById("requestCount").innerText = requestCount;
  document.getElementById("favoriteCount").innerText = favoriteCount;

  if(reviews.length > 0){
    const total = reviews.reduce((sum, r) => sum + Number(r.rating || 0), 0);
    document.getElementById("ratingText").innerText = "Average Rating: " + (total / reviews.length).toFixed(1) + "/5";
  } else {
    document.getElementById("ratingText").innerText = "Average Rating: No reviews yet";
  }

  showListings(listings);
  showReviews(reviews);
}

function showListings(listings){
  const box = document.getElementById("sellerListings");
  box.innerHTML = "";

  if(listings.length === 0){
    box.innerHTML = "<p>No listings yet.</p>";
    return;
  }

  listings.forEach((item) => {
    box.innerHTML += `
      <div class="item">
        <h3>${item.itemName || "Untitled Item"}</h3>
        <p>Brand: ${item.brand || "N/A"}</p>
        <p>Size: ${item.size || "N/A"}</p>
        <p>Price: $${item.price || "0"}/day</p>
        <p>Status: ${item.inventoryStatus || "Available"}</p>
        <button onclick="window.location.href='item.html?id=${item.id}'">View Item</button>
      </div>
    `;
  });
}

function showReviews(reviews){
  const box = document.getElementById("reviews");
  box.innerHTML = "";

  if(reviews.length === 0){
    box.innerHTML = "<p>No reviews yet.</p>";
    return;
  }

  reviews.forEach((r) => {
    const stars = "★".repeat(r.rating || 0) + "☆".repeat(5 - (r.rating || 0));

    box.innerHTML += `
      <div class="item">
        <h3>${stars}</h3>
        <p>${r.review || ""}</p>
      </div>
    `;
  });
}
</script>

</body>
</html>
