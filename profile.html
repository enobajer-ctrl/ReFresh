<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Profile | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1000px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.profile-card,.box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:0 0 25px rgba(59,130,246,.15);
}

.avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#3B82F6;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  margin-bottom:20px;
}

.profile-card h2,.box h2{
  color:#3B82F6;
  margin-bottom:12px;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
}

button{
  padding:14px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  width:100%;
  cursor:pointer;
}

.review{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.review h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.review p{
  color:#ccc;
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>Profile</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="reviews.html">Reviews</a>
    </div>
  </div>

  <div class="profile-card">
    <div class="avatar">👤</div>
    <h2 id="profileName">Seller Profile</h2>
    <p id="ratingText">Average Rating: No reviews yet</p>
  </div>

  <div class="box">
    <h2>Search Seller Reviews</h2>
    <input id="sellerSearch" placeholder="Enter seller username">
    <button id="searchBtn">View Seller Reviews</button>
  </div>

  <div class="box">
    <h2>Seller Reviews</h2>
    <div id="reviews">Search a seller to view reviews.</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("searchBtn").addEventListener("click", loadSellerReviews);

async function loadSellerReviews(){
  const sellerName = document.getElementById("sellerSearch").value.trim();
  const reviewsDiv = document.getElementById("reviews");

  if(!sellerName){
    alert("Enter a seller username.");
    return;
  }

  document.getElementById("profileName").innerText = sellerName + "'s Profile";

  reviewsDiv.innerHTML = "";

  const snapshot = await getDocs(collection(db, "reviews"));

  let total = 0;
  let count = 0;

  snapshot.forEach((doc) => {
    const r = doc.data();

    if((r.sellerName || "").toLowerCase() === sellerName.toLowerCase()){
      total += Number(r.rating || 0);
      count++;

      const stars = "★".repeat(r.rating || 0) + "☆".repeat(5 - (r.rating || 0));

      reviewsDiv.innerHTML += `
        <div class="review">
          <h3>${stars}</h3>
          <p>${r.review || ""}</p>
        </div>
      `;
    }
  });

  if(count === 0){
    reviewsDiv.innerHTML = "<p>No reviews found for this seller.</p>";
    document.getElementById("ratingText").innerText = "Average Rating: No reviews yet";
  } else {
    const average = (total / count).toFixed(1);
    document.getElementById("ratingText").innerText = "Average Rating: " + average + "/5";
  }
}
</script>

</body>
</html>
