<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:white;min-height:100vh;padding:25px}
.page{max-width:900px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:65px}
.logo h1{color:#3B82F6}
.nav a{color:#3B82F6;text-decoration:none;font-weight:bold;margin-left:15px}
.box,.note{background:#1a1a1a;border:1px solid #333;border-radius:18px;padding:22px;margin-bottom:16px}
.box h2,.note h3{color:#3B82F6}
.note p{color:#ccc;margin-top:8px}
.small{color:#aaa;font-size:13px;margin-top:8px}
.badge{display:inline-block;margin-top:10px;background:#222;color:#3B82F6;padding:6px 10px;border-radius:8px;font-size:13px}
.empty{text-align:center;color:#aaa;padding:35px}
@media(max-width:700px){.top{flex-direction:column;gap:15px}.nav a{display:inline-block;margin:7px}}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="my-rentals.html">My Rentals</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <div class="box">
    <h2>Notifications</h2>
    <p class="small">Booking requests, rental updates, and account alerts will appear here.</p>
  </div>

  <div id="notificationsList">Loading...</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  const list = document.getElementById("notificationsList");
  list.innerHTML = "";

  let count = 0;
  const snapshot = await getDocs(collection(db, "notifications"));

  snapshot.forEach((docSnap) => {
    const n = docSnap.data();

    if(n.userId === user.uid){
      count++;

      list.innerHTML += `
        <div class="note">
          <h3>${n.title || "Notification"}</h3>
          <p>${n.message || ""}</p>
          <span class="badge">${n.read ? "Read" : "New"}</span>
          <p class="small">${n.createdAt || ""}</p>
        </div>
      `;
    }
  });

  if(count === 0){
    list.innerHTML = `
      <div class="empty">
        <h3>No notifications yet.</h3>
        <p>When someone books one of your items, it will show here.</p>
      </div>
    `;
  }
});
</script>

</body>
</html>
