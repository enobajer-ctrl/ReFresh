<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Listing | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:800px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:65px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
  box-shadow:0 0 18px rgba(59,130,246,.12);
  margin-bottom:22px;
}

h2{
  color:#3B82F6;
  margin-bottom:15px;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:15px;
}

textarea{
  min-height:110px;
}

button,.btn{
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:10px;
  padding:13px 16px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  margin-top:8px;
  margin-right:8px;
}

.delete{
  background:#7f1d1d;
}

.secondary{
  background:#222;
  border:1px solid #3B82F6;
}

.preview{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:18px;
}

.preview h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.preview p{
  color:#ccc;
  margin-bottom:6px;
}

.small{
  color:#aaa;
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="browse.html">Browse</a>
    </div>
  </div>

  <div class="box">
    <h2>Edit Listing</h2>
    <p class="small">Update your listing details below.</p>
    <br>

    <input id="itemName" placeholder="Item Name">
    <input id="brand" placeholder="Brand">
    <input id="size" placeholder="Size">
    <input id="price" placeholder="Price Per Day">

    <select id="category">
      <option value="">Category</option>
      <option>Clothing</option>
      <option>Shoes</option>
      <option>Bags</option>
      <option>Belts</option>
      <option>Watches</option>
      <option>Jewelry</option>
      <option>Accessories</option>
    </select>

    <select id="condition">
      <option value="">Condition</option>
      <option>New</option>
      <option>Like New</option>
      <option>Good</option>
      <option>Used</option>
    </select>

    <select id="status">
      <option>Available</option>
      <option>Unavailable</option>
      <option>Rented</option>
    </select>

    <textarea id="description" placeholder="Description"></textarea>

    <button id="saveBtn">Save Changes</button>
    <button id="deleteBtn" class="delete">Delete Listing</button>
    <a href="dashboard.html" class="btn secondary">Back To Dashboard</a>
  </div>

  <div class="box">
    <h2>Preview</h2>

    <div class="preview">
      <h3 id="previewName">Item Name</h3>
      <p id="previewBrand">Brand: N/A</p>
      <p id="previewSize">Size: N/A</p>
      <p id="previewPrice">$0/day</p>
      <p id="previewCategory">Category: N/A</p>
      <p id="previewCondition">Condition: N/A</p>
      <p id="previewStatus">Status: Available</p>
      <p id="previewDescription">Description: N/A</p>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const listingId = params.get("id");

if(!listingId){
  alert("No listing found.");
  window.location.href = "dashboard.html";
}

const listingRef = doc(db, "listings", listingId);

const itemName = document.getElementById("itemName");
const brand = document.getElementById("brand");
const size = document.getElementById("size");
const price = document.getElementById("price");
const category = document.getElementById("category");
const condition = document.getElementById("condition");
const status = document.getElementById("status");
const description = document.getElementById("description");

async function loadListing(){
  try{
    const snap = await getDoc(listingRef);

    if(!snap.exists()){
      alert("Listing not found.");
      window.location.href = "dashboard.html";
      return;
    }

    const item = snap.data();

    itemName.value = item.itemName || "";
    brand.value = item.brand || "";
    size.value = item.size || "";
    price.value = item.price || "";
    category.value = item.category || "";
    condition.value = item.condition || "";
    status.value = item.inventoryStatus || "Available";
    description.value = item.description || "";

    updatePreview();

  }catch(error){
    alert(error.message);
  }
}

function updatePreview(){
  document.getElementById("previewName").innerText =
    itemName.value || "Item Name";

  document.getElementById("previewBrand").innerText =
    "Brand: " + (brand.value || "N/A");

  document.getElementById("previewSize").innerText =
    "Size: " + (size.value || "N/A");

  document.getElementById("previewPrice").innerText =
    "$" + (price.value || "0") + "/day";

  document.getElementById("previewCategory").innerText =
    "Category: " + (category.value || "N/A");

  document.getElementById("previewCondition").innerText =
    "Condition: " + (condition.value || "N/A");

  document.getElementById("previewStatus").innerText =
    "Status: " + (status.value || "Available");

  document.getElementById("previewDescription").innerText =
    "Description: " + (description.value || "N/A");
}

[itemName, brand, size, price, category, condition, status, description].forEach((field) => {
  field.addEventListener("input", updatePreview);
  field.addEventListener("change", updatePreview);
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  try{
    await updateDoc(listingRef, {
      itemName: itemName.value,
      brand: brand.value,
      size: size.value,
      price: price.value,
      category: category.value,
      condition: condition.value,
      inventoryStatus: status.value,
      description: description.value,
      lastUpdated: new Date().toISOString()
    });

    alert("Listing updated!");
    window.location.href = "dashboard.html";

  }catch(error){
    alert(error.message);
  }
});

document.getElementById("deleteBtn").addEventListener("click", async () => {
  const confirmDelete = confirm("Are you sure you want to delete this listing?");

  if(!confirmDelete){
    return;
  }

  try{
    await deleteDoc(listingRef);

    alert("Listing deleted.");
    window.location.href = "dashboard.html";

  }catch(error){
    alert(error.message);
  }
});

loadListing();
</script>

</body>
</html>
