<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  background:#1a1a1a;
  width:100%;
  max-width:430px;
  padding:35px;
  border-radius:20px;
  border:1px solid #333;
  box-shadow:0 0 30px rgba(59,130,246,.25);
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo img{
  width:120px;
  margin-bottom:10px;
}

.logo h1{
  color:#3B82F6;
  letter-spacing:3px;
}

.login-box h2{
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#3B82F6;
}

button{
  width:100%;
  padding:15px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.links{
  margin-top:25px;
  text-align:center;
}

.links a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
}

.small{
  margin-top:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">
    <img src="image-1.jpg" alt="ReFresh Logo">
    <h1>REFRESH</h1>
  </div>

  <h2>Welcome Back</h2>
  <p class="subtitle">Log in to manage rentals and listings.</p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button id="loginBtn">Login</button>

  <div class="links">
    <p class="small">Don't have an account?</p>
    <a href="signup.html">Create Account</a>
    <br><br>
    <a href="index.html">← Back Home</a>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      window.location.href = "dashboard.html";
    })
    .catch((error) => {
      alert(error.message);
    });
});
</script>

</body>
</html>
