<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | ReFresh</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#111;color:white;min-height:100vh;padding:25px}
.box{max-width:520px;margin:40px auto;background:#1a1a1a;border:1px solid #333;border-radius:20px;padding:30px;box-shadow:0 0 25px rgba(59,130,246,.2)}
.logo{text-align:center;margin-bottom:25px}
.logo img{width:90px}
h1,h2{color:#3B82F6;text-align:center;margin-bottom:15px}
.avatar{width:90px;height:90px;border-radius:50%;background:#3B82F6;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold}
input,textarea{width:100%;padding:14px;margin-bottom:14px;background:#111;border:1px solid #333;border-radius:12px;color:white;font-size:15px}
textarea{min-height:100px}
button,.btn{width:100%;display:block;text-align:center;background:#3B82F6;color:white;border:none;border-radius:12px;padding:14px;font-weight:bold;text-decoration:none;margin-top:10px;cursor:pointer}
.secondary{background:#222;border:1px solid #3B82F6}
.small{color:#aaa;text-align:center;margin-bottom:20px}
</style>
</head>

<body>

<div class="box">
  <div class="logo">
    <img src="image-1.jpg" alt="ReFresh Logo">
  </div>

  <h1>Account Settings</h1>
  <div class="avatar" id="avatarInitials">RF</div>

  <p class="small" id="accountStatus">Loading account...</p>

  <input id="username" placeholder="Username">
  <textarea id="bio" placeholder="Bio"></textarea>

  <button id="saveBtn">Save Changes</button>
  <a class="btn secondary" href="profile.html">Back To Profile</a>
  <a class="btn secondary" href="dashboard.html">Back To Dashboard</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

function getInitials(username){
  if(!username) return "RF";
  return username.substring(0,2).toUpperCase();
}

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  const userSnap = await getDoc(doc(db, "users", user.uid));
  const data = userSnap.exists() ? userSnap.data() : {};

  document.getElementById("username").value = data.username || "";
  document.getElementById("bio").value = data.bio || "";
  document.getElementById("avatarInitials").innerText = data.initials || getInitials(data.username);
  document.getElementById("accountStatus").innerText = "Signed in";
});

document.getElementById("saveBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value.trim();
  const bio = document.getElementById("bio").value.trim();

  if(!username){
    alert("Username cannot be empty.");
    return;
  }

  await setDoc(doc(db, "users", currentUser.uid), {
    username: username,
    bio: bio || "ReFresh member.",
    initials: getInitials(username),
    email: currentUser.email
  }, { merge: true });

  alert("Profile updated!");
  window.location.href = "profile.html";
});
</script>

</body>
</html>
