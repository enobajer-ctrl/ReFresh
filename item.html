<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Item Details | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1100px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.item-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.image-box,.details-box,.rent-box,.seller-box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 25px rgba(59,130,246,.15);
}

.fake-img{
  height:420px;
  background:linear-gradient(135deg,#222,#333);
  border-radius:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#3B82F6;
  font-size:90px;
}

.main-photo{
  width:100%;
  height:420px;
  object-fit:cover;
  border-radius:18px;
  background:#222;
}

.thumbnail-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
  gap:10px;
  margin-top:14px;
}

.thumb{
  width:100%;
  height:75px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #333;
  cursor:pointer;
  opacity:.75;
}

.thumb:hover,.thumb.active{
  border-color:#3B82F6;
  opacity:1;
}

h2{
  color:#3B82F6;
  font-size:34px;
  margin-bottom:15px;
}

p{
  color:#ccc;
  margin:10px 0;
}

.price{
  font-size:26px;
  color:#3B82F6;
  font-weight:bold;
}

.badge{
  display:inline-block;
  background:#222;
  color:#3B82F6;
  padding:7px 10px;
  border-radius:10px;
  font-size:13px;
  margin:5px 5px 10px 0;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:16px;
  margin:10px 0;
}

button,.btn{
  width:100%;
  padding:15px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  margin-top:12px;
  cursor:pointer;
  display:block;
  text-align:center;
  text-decoration:none;
}

.secondary{
  background:#222;
  border:1px solid #3B82F6;
}

.danger{
  background:#333;
}

.total{
  font-size:24px;
  color:#3B82F6;
  font-weight:bold;
}

.small{
  color:#888;
  font-size:13px;
}

@media(max-width:800px){
  .item-layout{
    grid-template-columns:1fr;
  }

  .top{
    flex-direction:column;
    gap:18px;
  }

  .nav a{
    display:inline-block;
    margin:8px;
  }

  .main-photo,.fake-img{
    height:330px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="favorites.html">Favorites</a>
      <a href="my-rentals.html">My Rentals</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <div class="item-layout">

    <div class="image-box">
      <div id="photoArea">
        <div class="fake-img">👕</div>
      </div>
    </div>

    <div>
      <div class="details-box">
        <span class="badge" id="categoryBadge">Category</span>
        <span class="badge" id="conditionBadge">Condition</span>
        <span class="badge" id="statusBadge">Available</span>

        <h2 id="itemName">Loading item...</h2>
        <p id="brand"></p>
        <p id="size"></p>
        <p id="description"></p>
        <p class="price" id="price"></p>
      </div>

      <br>

      <div class="rent-box">
        <h2>Rental Estimate</h2>

        <label>Number of days</label>
        <input id="daysInput" type="number" min="1" value="1">

        <p>Daily Price: <span id="dailyPrice">$0</span></p>
        <p class="total">Total: <span id="totalPrice">$0</span></p>
        <p class="small">Requesting this item does not charge you yet.</p>

        <button id="requestBtn">Request To Rent</button>
        <button id="favoriteBtn" class="secondary">♡ Save Item</button>
        <button id="messageBtn" class="secondary">Message Seller</button>
        <button id="reviewBtn" class="danger">Leave Review</button>
        <button id="checkoutBtn">Checkout</button>
      </div>

      <br>

      <div class="seller-box">
        <h2>Seller</h2>
        <p id="seller"></p>
        <a id="sellerProfile" class="btn secondary" href="#">View Seller Profile</a>
      </div>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
const itemId = params.get("id");

let currentItem = null;
let dailyPrice = 0;

const daysInput = document.getElementById("daysInput");

async function loadItem(){
  if(!itemId){
    document.getElementById("itemName").innerText = "Item not found";
    return;
  }

  const itemRef = doc(db, "listings", itemId);
  const itemSnap = await getDoc(itemRef);

  if(itemSnap.exists()){
    currentItem = itemSnap.data();
    dailyPrice = Number(currentItem.price || 0);

    loadPhotos(currentItem);

    document.getElementById("itemName").innerText = currentItem.itemName || "Untitled Item";
    document.getElementById("brand").innerText = "Brand: " + (currentItem.brand || "N/A");
    document.getElementById("size").innerText = "Size: " + (currentItem.size || "N/A");
    document.getElementById("description").innerText = "Description: " + (currentItem.description || "No description yet.");
    document.getElementById("price").innerText = "$" + dailyPrice + "/day";

    document.getElementById("categoryBadge").innerText = currentItem.category || "General";
    document.getElementById("conditionBadge").innerText = currentItem.condition || "Condition N/A";
    document.getElementById("statusBadge").innerText = currentItem.inventoryStatus || "Available";

    document.getElementById("seller").innerText = "Posted by: " + (currentItem.sellerName || "Seller");
    document.getElementById("sellerProfile").href =
      "profile.html?seller=" + encodeURIComponent(currentItem.sellerName || "Seller");

    updateTotal();
  } else {
    document.getElementById("itemName").innerText = "Item not found";
  }
}

function loadPhotos(item){
  const photoArea = document.getElementById("photoArea");
  const photos = item.photoUrls || [];

  if(photos.length === 0){
    photoArea.innerHTML = `<div class="fake-img">👕</div>`;
    return;
  }

  photoArea.innerHTML = `
    <img id="mainPhoto" class="main-photo" src="${photos[0]}" alt="Listing photo">

    <div class="thumbnail-row">
      ${photos.map((photo, index) => `
        <img 
          class="thumb ${index === 0 ? "active" : ""}" 
          src="${photo}" 
          data-photo="${photo}"
          alt="Listing photo ${index + 1}">
      `).join("")}
    </div>
  `;

  document.querySelectorAll(".thumb").forEach((thumb) => {
    thumb.addEventListener("click", () => {
      document.getElementById("mainPhoto").src = thumb.dataset.photo;

      document.querySelectorAll(".thumb").forEach((t) => t.classList.remove("active"));
      thumb.classList.add("active");
    });
  });
}

function updateTotal(){
  const days = Number(daysInput.value || 1);
  const total = days * dailyPrice;

  document.getElementById("dailyPrice").innerText = "$" + dailyPrice;
  document.getElementById("totalPrice").innerText = "$" + total.toFixed(2);
}

daysInput.addEventListener("input", updateTotal);

document.getElementById("requestBtn").addEventListener("click", async () => {
  const user = auth.currentUser;

  if(!user){
    alert("Please log in to request this item.");
    window.location.href = "login.html";
    return;
  }

  if(!currentItem){
    alert("Item not loaded yet.");
    return;
  }

  const days = Number(daysInput.value || 1);
  const totalPrice = days * dailyPrice;

  try{
    await addDoc(collection(db, "rentalRequests"), {
      listingId: itemId,
      itemName: currentItem.itemName || "",
      brand: currentItem.brand || "",
      size: currentItem.size || "",
      price: dailyPrice,
      days: days,
      totalPrice: totalPrice,
      sellerName: currentItem.sellerName || "Seller",
      buyerId: user.uid,
      buyerEmail: user.email,
      status: "pending"
    });

    alert("Rental request sent!");
  } catch(error){
    alert(error.message);
  }
});

document.getElementById("favoriteBtn").addEventListener("click", async () => {
  const user = auth.currentUser;

  if(!user){
    alert("Please log in to save favorites.");
    window.location.href = "login.html";
    return;
  }

  try{
    await addDoc(collection(db, "favorites"), {
      userId: user.uid,
      listingId: itemId
    });

    document.getElementById("favoriteBtn").innerText = "Saved ✓";
    alert("Saved to favorites!");
  } catch(error){
    alert(error.message);
  }
});

document.getElementById("messageBtn").addEventListener("click", () => {
  if(!itemId){
    alert("Item not loaded.");
    return;
  }

  window.location.href = "messaging.html?listingId=" + itemId;
});

document.getElementById("reviewBtn").addEventListener("click", () => {
  if(!currentItem){
    alert("Item not loaded.");
    return;
  }

  window.location.href = "reviews.html?seller=" + encodeURIComponent(currentItem.sellerName || "Seller");
});

document.getElementById("checkoutBtn").addEventListener("click", () => {
  if(!itemId){
    alert("Item not loaded.");
    return;
  }

  window.location.href = "checkout.html?id=" + itemId;
});

loadItem();
</script>

</body>
</html>
