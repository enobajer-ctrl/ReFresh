<!DOCTYPE html>
<html>
<head>
  <title>Browse ReFresh</title>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:30px;">

<h1>Browse ReFresh</h1>

<h2>Available Rentals</h2>

<div id="listings"></div>

<br><br>
<a href="index.html">← Back Home</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const listingsDiv = document.getElementById("listings");

const querySnapshot = await getDocs(collection(db, "listings"));

querySnapshot.forEach((doc) => {
  const item = doc.data();

  listingsDiv.innerHTML += `
    <div style="background:#1a1a1a;padding:20px;margin:15px 0;border-radius:12px;">
      <h3>${item.itemName}</h3>
      <p>Brand: ${item.brand}</p>
      <p>Size: ${item.size}</p>
      <p>$${item.price}/day</p>
      <p>Posted by: ${item.sellerName || "Unknown Seller"}</p>
    </div>
  `;
});
</script>

</body>
</html>
