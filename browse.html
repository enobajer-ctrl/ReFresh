<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse Listings | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1200px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.hero{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:0 0 25px rgba(59,130,246,.18);
}

.hero h2{
  font-size:32px;
  color:#3B82F6;
  margin-bottom:10px;
}

.hero p{
  color:#bbb;
}

.member-note{
  background:#101827;
  border:1px solid #3B82F6;
  color:#bfdbfe;
  border-radius:16px;
  padding:15px;
  margin-bottom:20px;
  display:none;
}

.member-note a{
  color:white;
  font-weight:bold;
}

.filters{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:20px;
  margin-bottom:25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}

input,select{
  width:100%;
  padding:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:15px;
}

input:focus,select:focus{
  outline:none;
  border-color:#3B82F6;
}

#listings{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  box-shadow:0 0 20px rgba(59,130,246,.12);
}

.fake-img{
  height:180px;
  background:linear-gradient(135deg,#222,#333);
  border-radius:14px;
  margin-bottom:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#3B82F6;
  font-size:48px;
}

.listing-img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:18px;
}

.card h3{
  font-size:24px;
  margin-bottom:12px;
}

.card p{
  color:#ccc;
  margin-bottom:8px;
}

.price{
  color:#3B82F6;
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

.seller a{
  color:#3B82F6;
  font-weight:bold;
  text-decoration:none;
}

.badge{
  display:inline-block;
  background:#222;
  color:#3B82F6;
  padding:5px 9px;
  border-radius:8px;
  font-size:13px;
  margin:4px 4px 8px 0;
}

.member-badge{
  background:#064e3b;
  color:#bbf7d0;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.rentBtn,.favoriteBtn{
  flex:1;
  padding:13px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.rentBtn{
  background:#3B82F6;
  color:white;
}

.favoriteBtn{
  background:#222;
  color:white;
  border:1px solid #444;
}

.empty{
  color:#aaa;
  margin-top:20px;
}

.count{
  color:#aaa;
  margin-bottom:15px;
}

@media(max-width:650px){
  .top{flex-direction:column;gap:18px}
  .nav a{display:inline-block;margin:8px}
  .actions{flex-direction:column}
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Sell</a>
      <a href="membership.html">Membership</a>
      <a href="favorites.html">Favorites</a>
      <a href="my-rentals.html">My Rentals</a>
      <a href="profile.html">Profile</a>
      <a href="login.html">Login</a>
    </div>
  </div>

  <div class="hero">
    <h2>Browse Listings</h2>
    <p>Search and filter rentals from ReFresh sellers.</p>
  </div>

  <div id="memberNote" class="member-note">
    💎 ReFresh Membership is required to save favorites and rent items.
    <a href="membership.html">Become a member</a>
  </div>

  <div class="filters">
    <input id="searchInput" type="text" placeholder="Search item, brand, seller...">

    <select id="categoryFilter">
      <option value="">All Categories</option>
      <option>Clothing</option>
      <option>Shoes</option>
      <option>Bags</option>
      <option>Belts</option>
      <option>Watches</option>
      <option>Jewelry</option>
      <option>Accessories</option>
    </select>

    <select id="priceFilter">
      <option value="">Any Price</option>
      <option value="10">Under $10/day</option>
      <option value="25">Under $25/day</option>
      <option value="50">Under $50/day</option>
      <option value="100">Under $100/day</option>
    </select>

    <input id="sizeFilter" type="text" placeholder="Size">

    <select id="sortFilter">
      <option value="newest">Newest</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="az">A-Z</option>
    </select>
  </div>

  <p class="count" id="countText">Loading listings...</p>

  <div id="listings">
    <p class="empty">Loading listings...</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const listingsDiv = document.getElementById("listings");
const countText = document.getElementById("countText");

const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");
const priceFilter = document.getElementById("priceFilter");
const sizeFilter = document.getElementById("sizeFilter");
const sortFilter = document.getElementById("sortFilter");
const memberNote = document.getElementById("memberNote");

let allListings = [];
let currentUser = null;
let membershipActive = false;

onAuthStateChanged(auth, async (user) => {
  currentUser = user;

  if(user){
    const userSnap = await getDoc(doc(db, "users", user.uid));
    const userData = userSnap.exists() ? userSnap.data() : {};
    membershipActive = userData.membershipStatus === "active";
  }

  if(!membershipActive){
    memberNote.style.display = "block";
  } else {
    memberNote.style.display = "none";
  }
});

async function loadListings(){
  listingsDiv.innerHTML = "";
  allListings = [];

  const querySnapshot = await getDocs(collection(db, "listings"));

  querySnapshot.forEach((docSnap) => {
    allListings.push({
      id: docSnap.id,
      ...docSnap.data()
    });
  });

  applyFilters();
}

function applyFilters(){
  let filtered = [...allListings];

  const searchTerm = searchInput.value.toLowerCase();
  const category = categoryFilter.value.toLowerCase();
  const maxPrice = priceFilter.value;
  const size = sizeFilter.value.toLowerCase();
  const sort = sortFilter.value;

  if(searchTerm){
    filtered = filtered.filter((item) =>
      (item.itemName || "").toLowerCase().includes(searchTerm) ||
      (item.brand || "").toLowerCase().includes(searchTerm) ||
      (item.sellerName || "").toLowerCase().includes(searchTerm) ||
      (item.description || "").toLowerCase().includes(searchTerm)
    );
  }

  if(category){
    filtered = filtered.filter((item) =>
      (item.category || "").toLowerCase() === category
    );
  }

  if(maxPrice){
    filtered = filtered.filter((item) =>
      Number(item.price || 0) <= Number(maxPrice)
    );
  }

  if(size){
    filtered = filtered.filter((item) =>
      (item.size || "").toLowerCase().includes(size)
    );
  }

  if(sort === "low"){
    filtered.sort((a,b) => Number(a.price || 0) - Number(b.price || 0));
  }

  if(sort === "high"){
    filtered.sort((a,b) => Number(b.price || 0) - Number(a.price || 0));
  }

  if(sort === "az"){
    filtered.sort((a,b) => (a.itemName || "").localeCompare(b.itemName || ""));
  }

  if(sort === "newest"){
    filtered.sort((a,b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  }

  displayListings(filtered);
}

function getListingPhoto(item){
  const photos = item.photoUrls || item.photos || item.images || [];
  return item.mainPhoto || item.photoURL || item.imageUrl || photos[0] || "";
}

function displayListings(listings){
  listingsDiv.innerHTML = "";
  countText.innerText = listings.length + " listings found";

  if(listings.length === 0){
    listingsDiv.innerHTML = "<p class='empty'>No listings found.</p>";
    return;
  }

  listings.forEach((item) => {
    const sellerProfileLink = "profile.html?seller=" + encodeURIComponent(item.sellerName || "Seller");
    const photo = getListingPhoto(item);

    listingsDiv.innerHTML += `
      <div class="card">
        ${photo
          ? `<img class="listing-img" src="${photo}" alt="${item.itemName || "Listing photo"}">`
          : `<div class="fake-img">👕</div>`
        }

        <span class="badge">${item.category || "General"}</span>
        <span class="badge">${item.condition || "Condition N/A"}</span>
        ${item.verifiedSeller ? `<span class="badge member-badge">Verified Seller</span>` : ""}

        <h3>${item.itemName || "Untitled Item"}</h3>

        <p>Brand: ${item.brand || "N/A"}</p>
        <p>Size: ${item.size || "N/A"}</p>
        <p>${item.description || "No description yet."}</p>

        <p class="price">$${item.price || "0"}/day</p>

        <p class="seller">
          Posted by:
          <a href="${sellerProfileLink}">${item.sellerName || "Seller"}</a>
        </p>

        <div class="actions">
          <button class="rentBtn" data-rent="${item.id}">
            Rent Now
          </button>

          <button class="favoriteBtn" data-id="${item.id}">
            ♡ Save
          </button>
        </div>
      </div>
    `;
  });

  document.querySelectorAll("[data-rent]").forEach((button) => {
    button.addEventListener("click", () => {
      if(!currentUser){
        alert("Please log in to rent.");
        window.location.href = "login.html";
        return;
      }

      if(!membershipActive){
        alert("ReFresh Membership is required to rent.");
        window.location.href = "membership.html";
        return;
      }

      window.location.href = "item.html?id=" + button.dataset.rent;
    });
  });

  document.querySelectorAll(".favoriteBtn").forEach((button) => {
    button.addEventListener("click", async () => {
      if(!currentUser){
        alert("Please log in to save favorites.");
        window.location.href = "login.html";
        return;
      }

      if(!membershipActive){
        alert("ReFresh Membership is required to save favorites.");
        window.location.href = "membership.html";
        return;
      }

      await addDoc(collection(db, "favorites"), {
        userId: currentUser.uid,
        listingId: button.dataset.id,
        createdAt: new Date().toISOString()
      });

      button.innerText = "Saved ✓";
      alert("Saved to favorites!");
    });
  });
}

searchInput.addEventListener("input", applyFilters);
categoryFilter.addEventListener("change", applyFilters);
priceFilter.addEventListener("change", applyFilters);
sizeFilter.addEventListener("input", applyFilters);
sortFilter.addEventListener("change", applyFilters);

loadListings();
</script>

</body>
</html>
