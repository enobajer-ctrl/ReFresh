<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse Listings | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1100px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
  letter-spacing:3px;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.hero{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:0 0 25px rgba(59,130,246,.18);
}

.hero h2{
  font-size:32px;
  color:#3B82F6;
  margin-bottom:10px;
}

.hero p{
  color:#bbb;
}

.search-box{
  margin-bottom:25px;
}

.search-box input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #333;
  background:#1a1a1a;
  color:white;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  border-color:#3B82F6;
}

#listings{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  box-shadow:0 0 20px rgba(59,130,246,.12);
}

.fake-img{
  height:170px;
  background:linear-gradient(135deg,#222,#333);
  border-radius:14px;
  margin-bottom:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#3B82F6;
  font-size:42px;
}

.card h3{
  font-size:24px;
  margin-bottom:12px;
}

.card p{
  color:#ccc;
  margin-bottom:8px;
}

.price{
  color:#3B82F6;
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

.seller{
  margin-top:12px;
  color:#aaa;
  font-size:14px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.rentBtn,
.favoriteBtn{
  flex:1;
  padding:13px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.rentBtn{
  background:#3B82F6;
  color:white;
}

.favoriteBtn{
  background:#222;
  color:white;
  border:1px solid #444;
}

.empty{
  color:#aaa;
  margin-top:20px;
}

@media(max-width:650px){
  .top{
    flex-direction:column;
    gap:18px;
  }

  .nav a{
    display:inline-block;
    margin:8px;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Sell</a>
      <a href="profile.html">Profile</a>
      <a href="login.html">Login</a>
    </div>
  </div>

  <div class="hero">
    <h2>Browse Listings</h2>
    <p>Search rentals from ReFresh sellers.</p>
  </div>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search by item, brand, size, seller...">
  </div>

  <div id="listings">
    <p class="empty">Loading listings...</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const listingsDiv = document.getElementById("listings");
const searchInput = document.getElementById("searchInput");

let allListings = [];

async function loadListings(){
  listingsDiv.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "listings"));

  allListings = [];

  querySnapshot.forEach((doc) => {
    allListings.push({
      id: doc.id,
      ...doc.data()
    });
  });

  displayListings(allListings);
}

function displayListings(listings){
  listingsDiv.innerHTML = "";

  if(listings.length === 0){
    listingsDiv.innerHTML = "<p class='empty'>No listings found.</p>";
    return;
  }

  listings.forEach((item) => {
    listingsDiv.innerHTML += `
      <div class="card">
        <div class="fake-img">👕</div>
        <h3>${item.itemName || "Untitled Item"}</h3>
        <p>Brand: ${item.brand || "N/A"}</p>
        <p>Size: ${item.size || "N/A"}</p>
        <p class="price">$${item.price || "0"}/day</p>
        <p class="seller">Posted by: ${item.sellerName || "Seller"}</p>

        <div class="actions">
         <button class="rentBtn" onclick="window.location.href='item.html?id=${item.id}'">
  Rent Now
</button>
          <button class="favoriteBtn" data-id="${item.id}">♡ Save</button>
        </div>
      </div>
    `;
  });

  document.querySelectorAll(".favoriteBtn").forEach((button) => {
    button.addEventListener("click", async () => {
      const user = auth.currentUser;

      if(!user){
        alert("Please log in to save favorites.");
        window.location.href = "login.html";
        return;
      }

      await addDoc(collection(db, "favorites"), {
        userId: user.uid,
        listingId: button.dataset.id
      });

      button.innerText = "Saved ✓";
      alert("Saved to favorites!");
    });
  });
}

searchInput.addEventListener("input", () => {
  const searchTerm = searchInput.value.toLowerCase();

  const filtered = allListings.filter((item) => {
    return (
      (item.itemName || "").toLowerCase().includes(searchTerm) ||
      (item.brand || "").toLowerCase().includes(searchTerm) ||
      (item.size || "").toLowerCase().includes(searchTerm) ||
      (item.sellerName || "").toLowerCase().includes(searchTerm)
    );
  });

  displayListings(filtered);
});

loadListings();
</script>

</body>
</html>
