<!DOCTYPE html>
<html>
<head>
  <title>Browse ReFresh</title>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    h1 {
      color: #3B82F6;
      font-size: 40px;
    }

    a {
      color: #3B82F6;
      text-decoration: none;
      font-weight: bold;
    }

    #listings {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 20px;
    }

    .card h3 {
      color: white;
      font-size: 24px;
    }

    .price {
      color: #3B82F6;
      font-weight: bold;
      font-size: 20px;
    }

    .rentBtn {
      background: #3B82F6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      width: 100%;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h1>Browse ReFresh</h1>
<p>Available rentals from ReFresh sellers.</p>

<div id="listings">Loading listings...</div>

<br><br>
<a href="index.html">← Back Home</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const listingsDiv = document.getElementById("listings");
listingsDiv.innerHTML = "";

const querySnapshot = await getDocs(collection(db, "listings"));

querySnapshot.forEach((doc) => {
  const item = doc.data();

  listingsDiv.innerHTML += `
    <div class="card">
      <h3>${item.itemName || "Untitled Item"}</h3>
      <p>Brand: ${item.brand || "N/A"}</p>
      <p>Size: ${item.size || "N/A"}</p>
      <p class="price">$${item.price || "0"}/day</p>
      <p>Posted by: ${item.sellerName || "Seller"}</p>
      <button class="rentBtn">Rent Now</button>
    </div>
  `;
});
</script>

</body>
</html>
