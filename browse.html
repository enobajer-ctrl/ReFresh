<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browse Listings | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1100px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
  letter-spacing:3px;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.hero{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:30px;
  margin-bottom:30px;
  box-shadow:0 0 25px rgba(59,130,246,.18);
}

.hero h2{
  font-size:32px;
  color:#3B82F6;
  margin-bottom:10px;
}

.hero p{
  color:#bbb;
}

#listings{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  box-shadow:0 0 20px rgba(59,130,246,.12);
}

.card h3{
  font-size:24px;
  margin-bottom:12px;
}

.card p{
  color:#ccc;
  margin-bottom:8px;
}

.price{
  color:#3B82F6;
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

.seller{
  margin-top:12px;
  color:#aaa;
  font-size:14px;
}

.rentBtn{
  width:100%;
  padding:13px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}

.empty{
  color:#aaa;
  margin-top:20px;
}

@media(max-width:650px){
  .top{
    flex-direction:column;
    gap:18px;
  }

  .nav a{
    display:inline-block;
    margin:8px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Sell</a>
      <a href="login.html">Login</a>
    </div>
  </div>

  <div class="hero">
    <h2>Browse Listings</h2>
    <p>Rent clothing, shoes, accessories, watches, bags, and more from ReFresh sellers.</p>
  </div>

  <div id="listings">
    <p class="empty">Loading listings...</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const listingsDiv = document.getElementById("listings");
listingsDiv.innerHTML = "";

const querySnapshot = await getDocs(collection(db, "listings"));

if (querySnapshot.empty) {
  listingsDiv.innerHTML = "<p class='empty'>No listings yet.</p>";
}

querySnapshot.forEach((doc) => {
  const item = doc.data();

  listingsDiv.innerHTML += `
    <div class="card">
      <h3>${item.itemName || "Untitled Item"}</h3>
      <p>Brand: ${item.brand || "N/A"}</p>
      <p>Size: ${item.size || "N/A"}</p>
      <p class="price">$${item.price || "0"}/day</p>
      <p class="seller">Posted by: ${item.sellerName || "Seller"}</p>
      <button class="rentBtn">Rent Now</button>
    </div>
  `;
});
</script>

</body>
</html>
