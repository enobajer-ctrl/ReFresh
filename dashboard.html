<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Dashboard | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.dashboard{
  max-width:1100px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
  letter-spacing:3px;
}

.logout{
  background:#222;
  color:white;
  border:1px solid #444;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:25px;
  box-shadow:0 0 20px rgba(59,130,246,.12);
}

.card h2{
  color:#3B82F6;
  margin-bottom:10px;
}

.form-box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:30px;
  box-shadow:0 0 30px rgba(59,130,246,.2);
}

.form-box h2{
  margin-bottom:20px;
  color:#3B82F6;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#3B82F6;
}

button.upload{
  width:100%;
  padding:15px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.links{
  margin-top:25px;
  text-align:center;
}

.links a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin:0 10px;
}

@media(max-width:600px){
  .top{
    flex-direction:column;
    gap:20px;
  }
}
</style>
</head>

<body>

<div class="dashboard">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>Seller Dashboard</h1>
    </div>

    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <div class="cards">
    <div class="card">
      <h2>My Listings</h2>
      <p>Your uploaded items will appear on Browse.</p>
    </div>

    <div class="card">
      <h2>Active Rentals</h2>
      <p>0 active rentals</p>
    </div>

    <div class="card">
      <h2>Total Earnings</h2>
      <p>$0.00</p>
    </div>
  </div>

  <div class="form-box">
    <h2>Add New Listing</h2>

    <input id="sellerName" placeholder="Your Username">
    <input id="itemName" placeholder="Item Name">
    <input id="brand" placeholder="Brand">
    <input id="size" placeholder="Size">
    <input id="price" placeholder="Price Per Day">

    <button class="upload" id="uploadBtn">Upload Listing</button>
  </div>

  <div class="links">
    <a href="browse.html">Browse Listings</a>
    <a href="profile.html">My Profile</a>
    <a href="index.html">Back Home</a>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById("logoutBtn").addEventListener("click", () => {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
});

document.getElementById("uploadBtn").addEventListener("click", async () => {
  try {
    await addDoc(collection(db, "listings"), {
      sellerName: document.getElementById("sellerName").value,
      itemName: document.getElementById("itemName").value,
      brand: document.getElementById("brand").value,
      size: document.getElementById("size").value,
      price: document.getElementById("price").value
    });

    alert("Listing uploaded!");
  } catch (error) {
    alert(error.message);
  }
});
</script>

</body>
</html>
