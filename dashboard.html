<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Dashboard | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.dashboard{
  max-width:1200px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
  letter-spacing:2px;
}

.logout{
  background:#222;
  color:white;
  border:1px solid #444;
  padding:12px 18px;
  border-radius:10px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card,.box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  box-shadow:0 0 20px rgba(59,130,246,.12);
}

.card h2,.box h2{
  color:#3B82F6;
  margin-bottom:12px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:15px;
}

textarea{
  min-height:100px;
}

button{
  padding:12px 15px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.upload,.accept{
  background:#3B82F6;
  color:white;
}

.decline{
  background:#333;
  color:white;
}

.delete{
  background:#7f1d1d;
  color:white;
}

.request,.listing,.message{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.request h3,.listing h3,.message h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.request p,.listing p,.message p{
  color:#ccc;
  margin-bottom:6px;
}

.status{
  display:inline-block;
  padding:6px 10px;
  background:#222;
  color:#3B82F6;
  border-radius:8px;
  margin-top:8px;
}

.links{
  text-align:center;
  margin-top:25px;
}

.links a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin:0 10px;
}

@media(max-width:650px){
  .top{
    flex-direction:column;
    gap:18px;
  }

  .links a{
    display:block;
    margin:12px;
  }
}
</style>
</head>

<body>

<div class="dashboard">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>Seller Dashboard</h1>
    </div>

    <button class="logout" id="logoutBtn">Logout</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Total Requests</h2>
      <p id="totalRequests">0</p>
    </div>

    <div class="card">
      <h2>Pending</h2>
      <p id="pendingRequests">0</p>
    </div>

    <div class="card">
      <h2>Accepted</h2>
      <p id="acceptedRequests">0</p>
    </div>

    <div class="card">
      <h2>Declined</h2>
      <p id="declinedRequests">0</p>
    </div>

    <div class="card">
      <h2>Estimated Earnings</h2>
      <p id="earnings">$0.00</p>
      <small>You keep 90%</small>
    </div>
  </div>

  <div class="box">
    <h2>Add New Listing</h2>

    <input id="sellerName" placeholder="Your Username">
    <input id="itemName" placeholder="Item Name">
    <input id="brand" placeholder="Brand">
    <input id="size" placeholder="Size">
    <input id="price" placeholder="Price Per Day">

    <select id="category">
      <option value="">Choose Category</option>
      <option>Clothing</option>
      <option>Shoes</option>
      <option>Bags</option>
      <option>Belts</option>
      <option>Watches</option>
      <option>Jewelry</option>
      <option>Accessories</option>
    </select>

    <select id="condition">
      <option value="">Condition</option>
      <option>New</option>
      <option>Like New</option>
      <option>Good</option>
      <option>Used</option>
    </select>

    <textarea id="description" placeholder="Description"></textarea>

    <button class="upload" id="uploadBtn">Upload Listing</button>
  </div>

  <br>

  <div class="box">
    <h2>Messages</h2>
    <div id="messages">Loading messages...</div>
  </div>

  <br>

  <div class="box">
    <h2>Rental Requests</h2>
    <div id="requests">Loading requests...</div>
  </div>

  <br>

  <div class="box">
    <h2>My Listings</h2>
    <div id="myListings">Loading listings...</div>
  </div>

  <div class="links">
    <a href="browse.html">Browse</a>
    <a href="favorites.html">Favorites</a>
    <a href="profile.html">Profile</a>
    <a href="index.html">Home</a>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById("logoutBtn").addEventListener("click", () => {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
});

document.getElementById("uploadBtn").addEventListener("click", async () => {
  try {
    await addDoc(collection(db, "listings"), {
      sellerName: document.getElementById("sellerName").value,
      itemName: document.getElementById("itemName").value,
      brand: document.getElementById("brand").value,
      size: document.getElementById("size").value,
      price: document.getElementById("price").value,
      category: document.getElementById("category").value,
      condition: document.getElementById("condition").value,
      description: document.getElementById("description").value,
      inventoryStatus: "Available",
      createdAt: new Date().toISOString()
    });

    alert("Listing uploaded!");
    loadListings();
  } catch(error) {
    alert(error.message);
  }
});

async function loadMessages(){
  const messagesDiv = document.getElementById("messages");
  messagesDiv.innerHTML = "";

  const snapshot = await getDocs(collection(db, "messages"));

  if(snapshot.empty){
    messagesDiv.innerHTML = "<p>No messages yet.</p>";
    return;
  }

  snapshot.forEach((messageDoc) => {
    const msg = messageDoc.data();

    messagesDiv.innerHTML += `
      <div class="message">
        <h3>${msg.itemName || "Message"}</h3>
        <p>From: ${msg.senderEmail || "Unknown"}</p>
        <p>${msg.message || ""}</p>
        <p>Status: New</p>
      </div>
    `;
  });
}

async function loadRequests(){
  const requestsDiv = document.getElementById("requests");
  requestsDiv.innerHTML = "";

  let total = 0;
  let pending = 0;
  let accepted = 0;
  let declined = 0;
  let earnings = 0;

  const snapshot = await getDocs(collection(db, "rentalRequests"));

  if(snapshot.empty){
    requestsDiv.innerHTML = "<p>No rental requests yet.</p>";
  }

  snapshot.forEach((requestDoc) => {
    const r = requestDoc.data();
    total++;

    if(r.status === "accepted"){
      accepted++;
      earnings += Number(r.price || 0) * 0.9;
    } else if(r.status === "declined"){
      declined++;
    } else {
      pending++;
    }

    requestsDiv.innerHTML += `
      <div class="request">
        <h3>${r.itemName || "Requested Item"}</h3>
        <p>Buyer: ${r.buyerEmail || "Unknown"}</p>
        <p>Brand: ${r.brand || "N/A"}</p>
        <p>Size: ${r.size || "N/A"}</p>
        <p>Price: $${r.price || "0"}/day</p>
        <span class="status">${r.status || "pending"}</span>
        <br><br>
        <button class="accept" data-id="${requestDoc.id}">Accept</button>
        <button class="decline" data-id="${requestDoc.id}">Decline</button>
      </div>
    `;
  });

  document.getElementById("totalRequests").innerText = total;
  document.getElementById("pendingRequests").innerText = pending;
  document.getElementById("acceptedRequests").innerText = accepted;
  document.getElementById("declinedRequests").innerText = declined;
  document.getElementById("earnings").innerText = "$" + earnings.toFixed(2);

  document.querySelectorAll(".accept").forEach(button => {
    button.addEventListener("click", async () => {
      await updateDoc(doc(db, "rentalRequests", button.dataset.id), {
        status:"accepted"
      });

      alert("Request accepted!");
      loadRequests();
    });
  });

  document.querySelectorAll(".decline").forEach(button => {
    button.addEventListener("click", async () => {
      await updateDoc(doc(db, "rentalRequests", button.dataset.id), {
        status:"declined"
      });

      alert("Request declined.");
      loadRequests();
    });
  });
}

async function loadListings(){
  const listingsDiv = document.getElementById("myListings");
  listingsDiv.innerHTML = "";

  const snapshot = await getDocs(collection(db, "listings"));

  if(snapshot.empty){
    listingsDiv.innerHTML = "<p>No listings yet.</p>";
    return;
  }

  snapshot.forEach((listingDoc) => {
    const l = listingDoc.data();

    listingsDiv.innerHTML += `
      <div class="listing">
        <h3>${l.itemName || "Untitled Item"}</h3>
        <p>Seller: ${l.sellerName || "Seller"}</p>
        <p>Brand: ${l.brand || "N/A"}</p>
        <p>Size: ${l.size || "N/A"}</p>
        <p>Price: $${l.price || "0"}/day</p>
        <p>Status: ${l.inventoryStatus || "Available"}</p>
        <button class="delete" data-id="${listingDoc.id}">Delete Listing</button>
      </div>
    `;
  });

  document.querySelectorAll(".delete").forEach(button => {
    button.addEventListener("click", async () => {
      await deleteDoc(doc(db, "listings", button.dataset.id));
      alert("Listing deleted.");
      loadListings();
    });
  });
}

loadMessages();
loadRequests();
loadListings();
</script>

</body>
</html>
