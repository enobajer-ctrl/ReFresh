<!DOCTYPE html>
<html>
<head>
  <title>Seller Dashboard - ReFresh</title>
</head>

<body style="background:#111;color:white;font-family:Arial;padding:30px;">

<h1>Seller Dashboard</h1>

<button id="logoutBtn">Logout</button>

<br><br>

<div>
  <h2>My Listings</h2>
  <p>No listings yet.</p>
</div>

<hr>

<div>
  <h2>Active Rentals</h2>
  <p>0 active rentals</p>
</div>

<hr>

<div>
  <h2>Total Earnings</h2>
  <p>$0.00</p>
</div>

<hr>

<div>
  <h2>Add New Listing</h2>

  <input id="sellerName" placeholder="Your Username"><br><br>
  <input id="itemName" placeholder="Item Name"><br><br>
  <input id="brand" placeholder="Brand"><br><br>
  <input id="size" placeholder="Size"><br><br>
  <input id="price" placeholder="Price Per Day"><br><br>

  <button id="uploadBtn">Upload Listing</button>
</div>

<br><br>

<a href="profile.html">My Profile</a>
<br><br>

<a href="browse.html">Browse Listings</a>
<br><br>

<a href="index.html">Back Home</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSM9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById("logoutBtn").addEventListener("click", () => {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
});

document.getElementById("uploadBtn").addEventListener("click", async () => {
  alert("Upload button clicked");

  try {
    await addDoc(collection(db, "listings"), {
      sellerName: document.getElementById("sellerName").value,
      itemName: document.getElementById("itemName").value,
      brand: document.getElementById("brand").value,
      size: document.getElementById("size").value,
      price: document.getElementById("price").value
    });

    alert("Listing uploaded!");
  } catch (error) {
    alert(error.message);
  }
});
</script>

</body>
</html>
