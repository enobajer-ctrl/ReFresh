<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Rentals | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1000px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:65px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.hero{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:28px;
  margin-bottom:25px;
  box-shadow:0 0 18px rgba(59,130,246,.12);
}

.hero h2{
  color:#3B82F6;
  font-size:34px;
  margin-bottom:8px;
}

.small{
  color:#aaa;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:25px;
}

.stat{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:16px;
  padding:20px;
}

.stat h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.stat p{
  font-size:26px;
  font-weight:bold;
}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tab{
  background:#1a1a1a;
  border:1px solid #333;
  color:white;
  padding:12px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#3B82F6;
  border-color:#3B82F6;
}

.rental{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  margin-bottom:16px;
  box-shadow:0 0 18px rgba(59,130,246,.10);
}

.rental h3{
  color:#3B82F6;
  margin-bottom:10px;
}

.rental p{
  color:#ccc;
  margin-bottom:7px;
}

.badge{
  display:inline-block;
  padding:7px 10px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
  margin-top:8px;
  background:#222;
  color:#3B82F6;
}

.btn{
  display:inline-block;
  margin-top:12px;
  padding:11px 14px;
  border-radius:10px;
  background:#3B82F6;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.empty{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:30px;
  text-align:center;
  color:#aaa;
}

@media(max-width:700px){
  .top{flex-direction:column;gap:15px}
  .nav a{display:inline-block;margin:7px}
  .hero h2{font-size:28px}
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <div class="hero">
    <h2>My Rentals</h2>
    <p class="small">Track your rental requests, dates, and payment status.</p>
  </div>

  <div class="stats">
    <div class="stat">
      <h3>Total Rentals</h3>
      <p id="totalRentals">0</p>
    </div>

    <div class="stat">
      <h3>Upcoming</h3>
      <p id="upcomingRentals">0</p>
    </div>

    <div class="stat">
      <h3>Total Spent</h3>
      <p id="totalSpent">$0</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="pending">Pending</button>
    <button class="tab" data-filter="accepted">Accepted</button>
    <button class="tab" data-filter="completed">Completed</button>
  </div>

  <div id="rentalsList">Loading rentals...</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebaseestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let rentals = [];
let activeFilter = "all";

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  await loadRentals();
});

async function loadRentals(){
  rentals = [];
  const snapshot = await getDocs(collection(db, "rentalRequests"));

  snapshot.forEach((docSnap) => {
    const rental = docSnap.data();

    if(rental.buyerId === currentUser.uid || rental.buyerEmail === currentUser.email){
      rentals.push({
        id: docSnap.id,
        ...rental
      });
    }
  });

  updateStats();
  showRentals();
}

function updateStats(){
  let upcoming = 0;
  let spent = 0;
  const today = new Date().toISOString().split("T")[0];

  rentals.forEach((r) => {
    if((r.startDate || "") >= today){
      upcoming++;
    }

    spent += Number(r.totalPrice || r.total || 0);
  });

  document.getElementById("totalRentals").innerText = rentals.length;
  document.getElementById("upcomingRentals").innerText = upcoming;
  document.getElementById("totalSpent").innerText = "$" + spent.toFixed(2);
}

function showRentals(){
  const box = document.getElementById("rentalsList");
  box.innerHTML = "";

  let filtered = rentals;

  if(activeFilter !== "all"){
    filtered = rentals.filter((r) => (r.status || "pending") === activeFilter);
  }

  if(filtered.length === 0){
    box.innerHTML = `
      <div class="empty">
        <h3>No rentals found.</h3>
        <p>Browse items and start your first rental.</p>
        <a href="browse.html" class="btn">Browse Listings</a>
      </div>
    `;
    return;
  }

  filtered.forEach((r) => {
    box.innerHTML += `
      <div class="rental">
        <h3>${r.itemName || "Rental Item"}</h3>
        <p><strong>Seller:</strong> ${r.sellerName || "Seller"}</p>
        <p><strong>Dates:</strong> ${r.startDate || "N/A"} to ${r.endDate || "N/A"}</p>
        <p><strong>Days:</strong> ${r.days || "N/A"}</p>
        <p><strong>Total Paid:</strong> $${Number(r.totalPrice || r.total || 0).toFixed(2)}</p>
        <span class="badge">${r.status || "pending"}</span>
      </div>
    `;
  });
}

document.querySelectorAll(".tab").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
    button.classList.add("active");

    activeFilter = button.dataset.filter;
    showRentals();
  });
});
</script>

</body>
</html>
