<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Rentals | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#0b0b0d;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1100px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:65px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.hero,.stat,.rental,.empty{
  background:#171717;
  border:1px solid #2b2b2b;
  border-radius:22px;
  box-shadow:0 0 18px rgba(59,130,246,.09);
}

.hero{
  padding:28px;
  margin-bottom:22px;
  background:linear-gradient(135deg,#111827,#0b0b0d);
  border-color:#263244;
}

.hero h2{
  color:#3B82F6;
  font-size:34px;
  margin-bottom:8px;
}

.small{
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:22px;
}

.stat{
  padding:20px;
}

.stat h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.stat p{
  font-size:26px;
  font-weight:bold;
}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tab{
  background:#171717;
  border:1px solid #333;
  color:white;
  padding:12px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#3B82F6;
  border-color:#3B82F6;
}

.rental{
  padding:22px;
  margin-bottom:16px;
}

.rental-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.rental h3{
  color:#3B82F6;
  margin-bottom:10px;
}

.rental p{
  color:#ccc;
  margin-bottom:7px;
}

.badge{
  display:inline-block;
  padding:7px 10px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
  margin-top:8px;
  background:#222;
  color:#3B82F6;
}

.badge.good{
  background:#064e3b;
  color:#bbf7d0;
}

.badge.warn{
  background:#78350f;
  color:#fed7aa;
}

.badge.bad{
  background:#7f1d1d;
  color:#fecaca;
}

.btn{
  display:inline-block;
  margin-top:12px;
  padding:11px 14px;
  border-radius:10px;
  background:#3B82F6;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.btn.secondary{
  background:#222;
  border:1px solid #3B82F6;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.empty{
  padding:40px;
  text-align:center;
  color:#aaa;
}

.empty h3{
  color:#3B82F6;
  margin-bottom:10px;
}

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.info{
  background:#101010;
  border:1px solid #2e2e2e;
  border-radius:14px;
  padding:12px;
}

.info strong{
  color:#3B82F6;
}

@media(max-width:700px){
  .top{
    flex-direction:column;
    gap:15px;
  }

  .nav a{
    display:inline-block;
    margin:7px;
  }

  .hero h2{
    font-size:28px;
  }

  .rental-top{
    flex-direction:column;
  }

  .info-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="notifications.html">Notifications</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <section class="hero">
    <h2>My Rentals</h2>
    <p class="small">
      Track your rental requests, approval status, dates, deposits, returns, and total spending.
    </p>
  </section>

  <section class="stats">
    <div class="stat">
      <h3>Total Rentals</h3>
      <p id="totalRentals">0</p>
    </div>

    <div class="stat">
      <h3>Upcoming</h3>
      <p id="upcomingRentals">0</p>
    </div>

    <div class="stat">
      <h3>Deposits Held</h3>
      <p id="depositsHeld">$0</p>
    </div>

    <div class="stat">
      <h3>Total Spent</h3>
      <p id="totalSpent">$0</p>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="pending">Pending</button>
    <button class="tab" data-filter="accepted">Approved</button>
    <button class="tab" data-filter="returned">Returned</button>
    <button class="tab" data-filter="declined">Declined</button>
  </div>

  <div id="rentalsList">Loading rentals...</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let rentals = [];
let activeFilter = "all";

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  await loadRentals();
});

async function loadRentals(){
  rentals = [];

  const snapshot = await getDocs(collection(db, "rentalRequests"));

  snapshot.forEach((docSnap) => {
    const rental = docSnap.data();

    if(rental.buyerId === currentUser.uid || rental.buyerEmail === currentUser.email){
      rentals.push({
        id: docSnap.id,
        ...rental
      });
    }
  });

  rentals.sort((a,b) => {
    return (b.startDate || "").localeCompare(a.startDate || "");
  });

  updateStats();
  showRentals();
}

function money(value){
  return "$" + Number(value || 0).toFixed(2);
}

function getBadgeClass(status, depositStatus){
  if(status === "accepted" || depositStatus === "refunded") return "good";
  if(status === "pending" || depositStatus === "held" || depositStatus === "ready for refund") return "warn";
  if(status === "declined" || depositStatus === "claimed") return "bad";
  return "";
}

function getStatusText(r){
  const status = r.status || "pending";

  if(status === "accepted") return "Approved";
  if(status === "returned") return "Returned";
  if(status === "declined") return "Declined";
  if(status === "completed") return "Completed";

  return "Pending";
}

function updateStats(){
  let upcoming = 0;
  let spent = 0;
  let held = 0;

  const today = new Date().toISOString().split("T")[0];

  rentals.forEach((r) => {
    if((r.startDate || "") >= today && (r.status || "pending") !== "declined"){
      upcoming++;
    }

    spent += Number(r.totalPrice || r.total || 0);

    if((r.depositStatus || "held") === "held"){
      held += Number(r.deposit || 0);
    }
  });

  document.getElementById("totalRentals").innerText = rentals.length;
  document.getElementById("upcomingRentals").innerText = upcoming;
  document.getElementById("depositsHeld").innerText = money(held);
  document.getElementById("totalSpent").innerText = money(spent);
}

function showRentals(){
  const box = document.getElementById("rentalsList");
  box.innerHTML = "";

  let filtered = rentals;

  if(activeFilter !== "all"){
    filtered = rentals.filter((r) => (r.status || "pending") === activeFilter);
  }

  if(filtered.length === 0){
    box.innerHTML = `
      <div class="empty">
        <h3>No rentals found.</h3>
        <p>Browse items and start your first rental.</p>
        <a href="browse.html" class="btn">Browse Listings</a>
      </div>
    `;
    return;
  }

  filtered.forEach((r) => {
    const statusText = getStatusText(r);
    const depositStatus = r.depositStatus || "held";
    const badgeClass = getBadgeClass(r.status || "pending", depositStatus);

    box.innerHTML += `
      <div class="rental">
        <div class="rental-top">
          <div>
            <h3>${r.itemName || "Rental Item"}</h3>
            <p><strong>Seller:</strong> ${r.sellerName || "Seller"}</p>
            <p><strong>Dates:</strong> ${r.startDate || "N/A"} → ${r.endDate || "N/A"}</p>
            <p><strong>Days:</strong> ${r.days || "N/A"}</p>
          </div>

          <div>
            <span class="badge ${badgeClass}">${statusText}</span>
          </div>
        </div>

        <div class="info-grid">
          <div class="info">
            <p><strong>Total Paid</strong></p>
            <p>${money(r.totalPrice || r.total)}</p>
          </div>

          <div class="info">
            <p><strong>Deposit</strong></p>
            <p>${money(r.deposit)} • ${depositStatus}</p>
          </div>

          <div class="info">
            <p><strong>Delivery Method</strong></p>
            <p>${r.rentalMethod || "N/A"}</p>
          </div>

          <div class="info">
            <p><strong>Return Status</strong></p>
            <p>${r.returnStatus || "Not returned yet"}</p>
          </div>
        </div>

        <div class="actions">
          <a class="btn" href="messaging.html?listingId=${r.listingId || ""}">Message Seller</a>
          <a class="btn secondary" href="item.html?id=${r.listingId || ""}">View Item</a>
          ${(r.status === "returned" || r.status === "completed") 
            ? `<a class="btn secondary" href="reviews.html?seller=${encodeURIComponent(r.sellerName || "Seller")}">Leave Review</a>` 
            : ""
          }
        </div>
      </div>
    `;
  });
}

document.querySelectorAll(".tab").forEach((button) => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
    button.classList.add("active");

    activeFilter = button.dataset.filter;
    showRentals();
  });
});
</script>

</body>
</html>
