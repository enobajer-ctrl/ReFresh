<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Favorites | ReFresh</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:1100px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:35px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
  letter-spacing:3px;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.hero{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:0 0 25px rgba(59,130,246,.18);
}

.hero h2{
  font-size:32px;
  color:#3B82F6;
  margin-bottom:10px;
}

.hero p{
  color:#bbb;
}

#favorites{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:22px;
  box-shadow:0 0 20px rgba(59,130,246,.12);
}

.fake-img{
  height:170px;
  background:linear-gradient(135deg,#222,#333);
  border-radius:14px;
  margin-bottom:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#3B82F6;
  font-size:42px;
}

.card h3{
  font-size:24px;
  margin-bottom:12px;
}

.card p{
  color:#ccc;
  margin-bottom:8px;
}

.price{
  color:#3B82F6;
  font-size:20px;
  font-weight:bold;
  margin-top:12px;
}

button{
  width:100%;
  padding:13px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}

.empty{
  color:#aaa;
  margin-top:20px;
}

@media(max-width:650px){
  .top{
    flex-direction:column;
    gap:18px;
  }

  .nav a{
    display:inline-block;
    margin:8px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>ReFresh</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="dashboard.html">Sell</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <div class="hero">
    <h2>My Favorites</h2>
    <p>Your saved ReFresh listings.</p>
  </div>

  <div id="favorites">
    <p class="empty">Loading favorites...</p>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const favoritesDiv = document.getElementById("favorites");

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    alert("Please log in to view favorites.");
    window.location.href = "login.html";
    return;
  }

  favoritesDiv.innerHTML = "";

  const favoritesQuery = query(
    collection(db, "favorites"),
    where("userId", "==", user.uid)
  );

  const favoritesSnapshot = await getDocs(favoritesQuery);

  if (favoritesSnapshot.empty) {
    favoritesDiv.innerHTML = "<p class='empty'>No favorites saved yet.</p>";
    return;
  }

  favoritesSnapshot.forEach(async (favoriteDoc) => {
    const favorite = favoriteDoc.data();
    const listingRef = doc(db, "listings", favorite.listingId);
    const listingSnap = await getDoc(listingRef);

    if (listingSnap.exists()) {
      const item = listingSnap.data();

      favoritesDiv.innerHTML += `
        <div class="card">
          <div class="fake-img">👕</div>
          <h3>${item.itemName || "Untitled Item"}</h3>
          <p>Brand: ${item.brand || "N/A"}</p>
          <p>Size: ${item.size || "N/A"}</p>
          <p class="price">$${item.price || "0"}/day</p>
          <p>Posted by: ${item.sellerName || "Seller"}</p>
          <button onclick="window.location.href='item.html?id=${favorite.listingId}'">
            View Item
          </button>
        </div>
      `;
    }
  });
});
</script>

</body>
</html>
