<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reviews | ReFresh</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#111;
  color:white;
  min-height:100vh;
  padding:25px;
}

.page{
  max-width:900px;
  margin:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo img{
  width:70px;
}

.logo h1{
  color:#3B82F6;
}

.nav a{
  color:#3B82F6;
  text-decoration:none;
  font-weight:bold;
  margin-left:15px;
}

.box{
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:20px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 0 25px rgba(59,130,246,.15);
}

.box h2{
  color:#3B82F6;
  margin-bottom:15px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:15px;
}

textarea{
  min-height:120px;
}

button{
  width:100%;
  padding:14px;
  background:#3B82F6;
  color:white;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.review{
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.review h3{
  color:#3B82F6;
  margin-bottom:8px;
}

.review p{
  color:#ccc;
  margin-bottom:6px;
}
</style>
</head>

<body>

<div class="page">

  <div class="top">
    <div class="logo">
      <img src="image-1.jpg" alt="ReFresh Logo">
      <h1>Reviews</h1>
    </div>

    <div class="nav">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="profile.html">Profile</a>
    </div>
  </div>

  <div class="box">
    <h2>Leave a Seller Review</h2>

    <input id="sellerName" placeholder="Seller Username">
    
    <select id="rating">
      <option value="">Choose Rating</option>
      <option value="5">★★★★★ 5 Stars</option>
      <option value="4">★★★★☆ 4 Stars</option>
      <option value="3">★★★☆☆ 3 Stars</option>
      <option value="2">★★☆☆☆ 2 Stars</option>
      <option value="1">★☆☆☆☆ 1 Star</option>
    </select>

    <textarea id="reviewText" placeholder="Write your review..."></textarea>

    <button id="submitReview">Submit Review</button>
  </div>

  <div class="box">
    <h2>Recent Reviews</h2>
    <div id="reviews">Loading reviews...</div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDS9MD_sBFCmGUnJehJ9OkVczgQcOePlWE",
  authDomain: "refresh-7b0b7.firebaseapp.com",
  projectId: "refresh-7b0b7",
  storageBucket: "refresh-7b0b7.firebasestorage.app",
  messagingSenderId: "286051120509",
  appId: "1:286051120509:web:596ed691578537e8ca0814",
  measurementId: "G-NNGSL330VG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.getElementById("submitReview").addEventListener("click", async () => {
  const sellerName = document.getElementById("sellerName").value;
  const rating = document.getElementById("rating").value;
  const review = document.getElementById("reviewText").value;

  if(!sellerName || !rating || !review){
    alert("Fill out all review fields.");
    return;
  }

  await addDoc(collection(db, "reviews"), {
    sellerName: sellerName,
    rating: Number(rating),
    review: review
  });

  alert("Review submitted!");
  document.getElementById("reviewText").value = "";
  loadReviews();
});

async function loadReviews(){
  const reviewsDiv = document.getElementById("reviews");
  reviewsDiv.innerHTML = "";

  const snapshot = await getDocs(collection(db, "reviews"));

  if(snapshot.empty){
    reviewsDiv.innerHTML = "<p>No reviews yet.</p>";
    return;
  }

  snapshot.forEach((doc) => {
    const r = doc.data();
    const stars = "★".repeat(r.rating || 0) + "☆".repeat(5 - (r.rating || 0));

    reviewsDiv.innerHTML += `
      <div class="review">
        <h3>${r.sellerName || "Seller"}</h3>
        <p>${stars}</p>
        <p>${r.review || ""}</p>
      </div>
    `;
  });
}

loadReviews();
</script>

</body>
</html>
